services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: nod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nod
      POSTGRES_PASSWORD: '${NOD_POSTGRES_PASSWORD:?NOD_POSTGRES_PASSWORD ist erforderlich}'
      POSTGRES_DB: nod
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - 'nod-postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U nod'
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - nod-network
  runtime:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    init: true
    restart: unless-stopped
    environment:
      WORKSPACE_CONTAINER: workspace-nod-homelab
      BROWSER_CONTAINER: browser-nod-homelab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    networks:
      - nod-control
  browser:
    build:
      context: .
      dockerfile: Dockerfile.browser
    container_name: nod-browser
    hostname: nod-browser
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    read_only: true
    pids_limit: 4096
    mem_limit: 8g
    cpus: '${NOD_BROWSER_CPUS:-4}'
    shm_size: 1g
    volumes:
      - 'nod-browser-data:/data'
    tmpfs:
      - '/tmp:size=1g'
      - '/home/node:uid=1000,gid=1000,mode=700,size=256m'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - 'const s=require("node:net").connect("/data/control.sock");s.on("connect",()=>{s.end();process.exit(0)});s.on("error",()=>process.exit(1))'
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - nod-network
    image: ''
  workspace:
    build:
      context: .
      dockerfile: Dockerfile.workspace
    image: nod-workspace-local
    pull_policy: never
    container_name: nod-workspace
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 4096
    mem_limit: 8g
    cpus: ${NOD_WORKSPACE_CPUS:-2}
    volumes:
      - nod-workspaces:/workspace
      - nod-workspace-tools:/home/node
    network_mode: "service:workspace-network"
    depends_on:
      workspace-network:
        condition: service_healthy
        restart: true
    command:
      - sleep
      - infinity
  workspace-network:
    build:
      context: .
      dockerfile: Dockerfile.workspace
    image: nod-workspace-network-local
    pull_policy: never
    container_name: nod-workspace-network
    user: root
    init: true
    restart: unless-stopped
    entrypoint: /usr/local/bin/nod-workspace-network
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    tmpfs:
      - "/tmp:size=1m"
    pids_limit: 32
    mem_limit: 64m
    healthcheck:
      test:
        - CMD
        - test
        - "-f"
        - /tmp/network-ready
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - nod-network
  nod:
    build:
      context: .
      dockerfile: Dockerfile.nod
    container_name: nod-server
    init: true
    restart: unless-stopped
    ports:
      - '4310:4310'
    environment:
      PORT: 4310
      NOD_HOST: 0.0.0.0
      NOD_PUBLIC_URL: "${NOD_PUBLIC_URL}"
      NOD_AUTH_TOKEN: "${NOD_AUTH_TOKEN}"
      NOD_DATA_ROOT: /app/.local
      DATABASE_URL: 'postgresql://nod:${NOD_POSTGRES_PASSWORD}@postgres:5432/nod'
      DATABASE_POOL_MAX: '${DATABASE_POOL_MAX:-12}'
      LLM_PROVIDER: '${LLM_PROVIDER:-openai}'
      LLM_MODEL: '${LLM_MODEL}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY:-}'
      NOD_VAULT_KEY: '${NOD_VAULT_KEY:?NOD_VAULT_KEY ist erforderlich}'
      NOD_BROWSER_CPUS: '${NOD_BROWSER_CPUS:-4}'
      NOD_WORKSPACE_CPUS: '${NOD_WORKSPACE_CPUS:-2}'
      DOCKER_HOST: tcp://runtime:2375
      WORKSPACE_CONTAINER: workspace-nod-homelab
      BROWSER_CONTAINER: browser-nod-homelab
    volumes:
      - nod-data:/app/.local
      - nod-workspaces:/app/.local/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      runtime:
        condition: service_started
      browser:
        condition: service_healthy
      workspace:
        condition: service_started
      workspace-network:
        condition: service_healthy
    networks:
      - nod-network
      - nod-control
volumes:
  nod-postgres-data:
    name: nod-postgres-data
  nod-browser-data:
    name: nod-browser-data
  nod-workspace-tools:
    name: nod-workspace-tools
  nod-workspaces:
    name: nod-workspaces
  nod-data:
    name: nod-data
networks:
  nod-network:
    name: nod-network
  nod-control:
    internal: true
